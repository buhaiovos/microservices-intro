apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms-deployment
  namespace: k8s-program-buhaiovos
  labels:
    app: songs-ms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      volumes:
        - name: songs-pv-storage
          persistentVolumeClaim:
            claimName: songs-pvc
      containers:
        - name: songs-ms
          image: songs-image:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SONGS_DB_URL
              value: songs-postgres-svc.k8s-program-buhaiovos.svc.cluster.local

            # config map
            - name: SONGS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: songs-config-map
                  key: database_name

            # secret
            - name: SONGS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: songs-db-secret
                  key: username
            - name: SONGS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: songs-db-secret
                  key: password

          volumeMounts:
            - mountPath: /usr/share/songs
              name: songs-pv-storage

