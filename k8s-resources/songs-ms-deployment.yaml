apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms-deployment
  namespace: k8s-program
  labels:
    app: songs-ms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      volumes:
        - name: songs-pv-storage
          persistentVolumeClaim:
            claimName: songs-pvc
      containers:
      - name: songs-ms
        image: songs-image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
          - name: SONGS_DB_URL
            value: songs-postgres-svc.k8s-program.svc.cluster.local
        volumeMounts:
          - mountPath: /usr/share/songs
            name: songs-pv-storage

