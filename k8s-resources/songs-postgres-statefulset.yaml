apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: songs-postgres
  namespace: k8s-program-buhaiovos
spec:
  selector:
    matchLabels:
      app: songs-postgres
  serviceName: songs-postgres-svc
  #songs-postgres-svc.k8s-program-buhaiovos.svc.cluster.local
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: songs-postgres
    spec:
      containers:
        - name: songs-postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: songs-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: songs-db-secret
                  key: password

          ports:
            - containerPort: 5432
              name: pg
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: pg-volume

            - mountPath: /docker-entrypoint-initdb.d
              name: pg-init
              readOnly: true
      volumes:
        - name: pg-init
          configMap:
            name: songs-config-map
            items:
              - key: songs_db_init.sql
                path: init.sql
  #
  volumeClaimTemplates:
    - metadata:
        name: pg-volume
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hostpath
        resources:
          requests:
            storage: 1Gi


