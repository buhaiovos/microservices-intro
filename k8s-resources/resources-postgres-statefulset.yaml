apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resources-postgres
  namespace: k8s-program
spec:
  selector:
    matchLabels:
      app: resources-postgres
  serviceName: resources-postgres-svc
  #resources-postgres-svc.k8s-program.svc.cluster.local
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: resources-postgres
    spec:
      containers:
        - name: resources-postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: resources-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resources-db-secret
                  key: password

          ports:
            - containerPort: 5432
              name: pg
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: pg-volume
            - mountPath: /docker-entrypoint-initdb.d
              name: pg-init
              readOnly: true

      volumes:
        - name: pg-init
          configMap:
            name: resources-config-map
            items:
              - key: resources_db_init.sql
                path: init.sql

  volumeClaimTemplates:
    - metadata:
        name: pg-volume
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hostpath
        resources:
          requests:
            storage: 1Gi

